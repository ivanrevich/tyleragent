<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Тайлер: силуэт в профиль — короткая взъерошенная стрижка, жёлтые очки, поднятый воротник. Смотрит вправо. -->
  <defs>
    <clipPath id="c"><circle cx="120" cy="120" r="120"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb3d1"/><stop offset="1" stop-color="#e46b9c"/>
    </linearGradient>
    <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe680"/><stop offset="1" stop-color="#f2b705"/>
    </linearGradient>
  </defs>
  <circle cx="120" cy="120" r="120" fill="url(#bg)"/>
  <g clip-path="url(#c)" fill="#0b0f18">
    <!-- голова и шея -->
    <path d="M90 250 L 94 202
             C 76 192, 64 168, 64 140
             C 64 98, 92 66, 130 64
             C 158 63, 174 82, 176 102
             L 179 111
             C 176 115, 175 118, 177 122
             L 192 145
             C 194 149, 191 153, 185 153
             L 181 154
             C 183 157, 183 161, 180 163
             L 177 165
             C 181 168, 181 172, 177 175
             C 177 183, 172 190, 162 192
             C 150 194, 142 193, 136 197
             C 137 212, 141 230, 147 250 Z"/>
    <!-- стрижка: коротко, слегка взъерошено сверху, чёлка вперёд -->
    <path d="M66 134
             C 58 104, 74 70, 106 58
             L 104 50 L 116 54 L 118 44 L 128 52 L 136 44 L 142 54 L 152 50 L 154 60
             C 168 64, 178 76, 180 90
             L 186 94 L 176 98
             C 170 92, 160 88, 150 88
             C 128 88, 108 96, 96 112
             C 86 124, 80 134, 74 146 Z"/>
    <!-- поднятый воротник кожанки -->
    <path d="M52 250 L 66 204 L 102 222 L 96 250 Z"/>
    <path d="M182 250 L 172 214 L 144 222 L 152 250 Z"/>
  </g>
  <!-- ухо -->
  <path d="M112 118 C 102 116, 100 136, 110 140" stroke="#e46b9c" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/>
  <!-- очки: жёлтая линза и дужка -->
  <path d="M112 116 L 160 112" stroke="#ffd23f" stroke-width="4" stroke-linecap="round"/>
  <path d="M158 109 L 184 109 C 187 109, 188 111, 187 114 L 184 124 C 183 127, 180 129, 176 129 L 166 129 C 161 129, 158 125, 158 120 Z" fill="url(#lens)"/>
  <path d="M162 113 L 176 113" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".8"/>
</svg>
