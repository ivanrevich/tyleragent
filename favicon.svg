<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Тайлер: силуэт в профиль — ёжик, очки, поднятый воротник. Смотрит вправо. -->
  <defs>
    <clipPath id="c"><circle cx="120" cy="120" r="120"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7ff4f"/><stop offset="1" stop-color="#a9d61a"/>
    </linearGradient>
  </defs>
  <circle cx="120" cy="120" r="120" fill="url(#bg)"/>
  <g clip-path="url(#c)" fill="#0b0f18">
    <!-- голова, шея -->
    <path d="M78 250 L84 196 C 70 182, 62 160, 64 134 C 66 98, 88 70, 122 66
             C 150 64, 168 78, 172 98 L 174 112 L 188 136 C 190 140, 188 143, 183 144 L 177 145
             L 179 152 L 175 156 L 178 162 C 179 170, 174 176, 166 177 L 150 178
             C 146 186, 146 196, 150 208 L 160 250 Z"/>
    <!-- ёжик -->
    <path d="M64 132 C 58 112, 62 92, 74 80 L 66 70 L 84 70 L 80 54 L 98 62 L 100 44 L 114 58 L 122 40 L 132 58
             L 146 44 L 148 62 L 164 54 L 160 70 L 176 70 L 168 82 C 172 88, 174 94, 174 100 L 150 92 L 110 86 L 84 100 Z"/>
    <!-- поднятый воротник кожанки -->
    <path d="M40 250 L 58 196 L 92 214 L 84 250 Z"/>
    <path d="M200 250 L 186 204 L 152 214 L 158 250 Z"/>
  </g>
  <!-- очки: линза и дужка -->
  <path d="M148 110 L 178 110 C 180 110, 181 112, 180 114 L 177 124 C 176 127, 173 128, 170 128 L 156 128 C 151 128, 148 124, 148 120 Z" fill="#f58fbc"/>
  <path d="M150 112 L 166 112" stroke="#fff" stroke-width="2.4" stroke-linecap="round" opacity=".7"/>
  <path d="M148 114 L 112 108" stroke="#f58fbc" stroke-width="4" stroke-linecap="round"/>
  <!-- ухо -->
  <path d="M104 112 C 96 110, 94 126, 102 132" stroke="#a9d61a" stroke-width="3" fill="none" stroke-linecap="round" opacity=".55"/>
</svg>
